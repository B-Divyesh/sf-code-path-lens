[package]
name = "code-path-lens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A bounded, evidence-backed code path viewer"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-code-path-lens"
readme = "README.md"
keywords = ["static-analysis", "call-graph", "developer-tools", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", "dist/", ".factory/"]

[[bin]]
name = "code-path-lens"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

